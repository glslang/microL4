[workspace]
resolver = "3"
members = ["core", "kernel", "loader", "model", "user/libsys", "user/root", "xtask"]
# Plain `cargo build` and `cargo test` only touch the host crates. The kernel,
# the loader and the user crates need their own targets and flags, so build
# them through `cargo xtask`.
default-members = ["core", "model", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.dev]
# The kernel and loader run under TCG emulation; unoptimised code is painfully
# slow there. Level 1 keeps debug assertions and readable backtraces.
opt-level = 1

[profile.release]
debug = true
