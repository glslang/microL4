[package]
name = "xtask"
description = "cargo xtask: build, image, run and test microL4"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The ACPI dump format and parser, for `cargo xtask acpidump`; `testing`
# provides the memory a dump describes.
l4core = { path = "../core", features = ["testing"] }
