[package]
name = "l4core"
description = "no_std logic shared by the loader, the kernel and the host-side tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Fake memory and a recording `Kernel` for host tests (`l4core::testing`).
# `model/` enables it; the kernel and the loader never do.
testing = []

[dev-dependencies]
# Random bytes for the ACPI parser (`core/src/acpi/tests.rs`). `std` alone:
# no forking, timeouts or failure files, which Miri forbids.
proptest = { version = "1", default-features = false, features = ["std"] }
