[package]
name = "kernel"
description = "The microL4 kernel, built for x86_64-unknown-none"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
l4core = { path = "../core" }

[features]
# Kernel console output, the boot summary and, from M5, the debug system
# calls (ADR 0021). It gates nothing until M7 builds a kernel without it.
debug = []
# The in-kernel self-tests a `test=` on the command line picks (ADR 0003),
# and every hook only they use. xtask builds every image with it.
selftest = ["debug"]
