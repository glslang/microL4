[package]
name = "l4model"
description = "A slow, obviously correct reference model of the capability core, and the proptest harness that checks l4core against it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
l4core = { path = "../core", features = ["testing"] }

[dev-dependencies]
# `std` alone: no forking or timeouts, which the harness does not use.
proptest = { version = "1", default-features = false, features = ["std"] }
