name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# ubuntu-24.04 matches the cloud sessions' image (QEMU 8.2), so scenario
# output, and from M8 golden images, agree between CI and sessions.
jobs:
  test:
    name: Test and build the VHDX
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # setup.sh also adds rustup's llvm-tools, whose llvm-objdump the
      # release kernel's disassembly check in `cargo xtask test` uses.
      - name: Install QEMU, OVMF, image tools, Rust targets and llvm-tools
        run: tools/setup.sh
      - name: Host tests, the release kernel's disassembly check and QEMU scenarios
        run: cargo xtask test
      - name: Upload scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs
          path: target/xtask/scenarios/*/serial.log
          if-no-files-found: ignore
      - name: Build the disk image
        run: cargo xtask image
      - name: Upload the VHDX for the Hyper-V check
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx
          path: target/xtask/image/disk.vhdx
          if-no-files-found: error
      # The M5 Hyper-V check (tools/hyperv/README.md, "At the M5 check"):
      # one VHDX per test, each in a folder named after it. threads and
      # fault are M5's done-when; ring3, tlb, isolation and redteam-movss
      # show what QEMU cannot: TF at syscall_entry, #XM, UMIP, a real TLB,
      # XSAVE switching, and the #DB a mov ss defers into ring 0.
      - name: Build the M5 check images
        run: |
          for test in threads fault ring3 tlb isolation redteam-movss; do
            cargo xtask image --cmdline "test=$test"
            mkdir -p "target/xtask/m5-check/$test"
            mv target/xtask/image/disk.vhdx "target/xtask/m5-check/$test/disk.vhdx"
          done
      - name: Upload the M5 check VHDXs
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx-m5-check
          path: target/xtask/m5-check
          if-no-files-found: error
      # The M8 Hyper-V check (tools/hyperv/README.md, "At the M8 check"):
      # tui boots test=tui on the selftest kernel, release test=release on
      # the release kernel, each in a folder named after it; beside them
      # the scenarios Test-L4Vhdx.ps1 -Scenario follows and the 1024x768
      # goldens the owner compares Hyper-V's thumbnails with by eye.
      - name: Build the M8 check images
        run: |
          mkdir -p target/xtask/m8-check/tui target/xtask/m8-check/release
          cargo xtask image --cmdline "test=tui"
          mv target/xtask/image/disk.vhdx target/xtask/m8-check/tui/disk.vhdx
          cargo xtask image --kernel release --cmdline "test=release"
          mv target/xtask/image/disk.vhdx target/xtask/m8-check/release/disk.vhdx
          cp tools/hyperv/m8-tui.scenario tools/hyperv/m8-release.scenario target/xtask/m8-check/
          cp -r tools/hyperv/golden target/xtask/m8-check/golden
      - name: Upload the M8 check VHDXs
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx-m8-check
          path: target/xtask/m8-check
          if-no-files-found: error
      # The M9 Hyper-V check's COM1 runs, first and in an artifact of their
      # own (tools/hyperv/README.md, "At the M9 check"): test=release on
      # the release kernel with uart's burst capped at 1 and at 15 and
      # root's 32-line flood, each in a folder named after it, beside the
      # scenarios Test-L4Vhdx.ps1 -Scenario follows. xtask's
      # the_com1_runs_are_release_with_the_cap_and_the_flood checks these
      # command lines against the scenarios'.
      - name: Build the M9 COM1 images
        run: |
          for burst in 1 15; do
            mkdir -p "target/xtask/m9-com1/release-burst$burst"
            cargo xtask image --kernel release --cmdline "test=release uart.burst=$burst release.flood=32"
            mv target/xtask/image/disk.vhdx "target/xtask/m9-com1/release-burst$burst/disk.vhdx"
          done
          cp tools/hyperv/m9-release-burst1.scenario tools/hyperv/m9-release-burst15.scenario target/xtask/m9-com1/
      - name: Upload the M9 COM1 VHDXs
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx-m9-com1
          path: target/xtask/m9-com1
          if-no-files-found: error
      # The M9 Hyper-V check's network runs (tools/hyperv/README.md, "At
      # the M9 check"): test=net on the selftest kernel at 192.168.77.2/24
      # via the host's 192.168.77.1 on New-L4Switch.ps1's switch, with
      # netvsc signalling the host by SignalEvent (net) or through the
      # monitor page (net-mnf), each in a folder named after it, beside the
      # scenarios Test-L4Vhdx.ps1 -Scenario follows. xtask's
      # the_network_runs_are_net_on_hyperv checks these command lines
      # against the scenarios'.
      - name: Build the M9 check images
        run: |
          mkdir -p target/xtask/m9-check/net target/xtask/m9-check/net-mnf
          cargo xtask image --cmdline "test=net net.ip=192.168.77.2/24 net.gw=192.168.77.1"
          mv target/xtask/image/disk.vhdx target/xtask/m9-check/net/disk.vhdx
          cargo xtask image --cmdline "test=net net.ip=192.168.77.2/24 net.gw=192.168.77.1 netvsc.mnf=1"
          mv target/xtask/image/disk.vhdx target/xtask/m9-check/net-mnf/disk.vhdx
          cp tools/hyperv/m9-net.scenario tools/hyperv/m9-net-mnf.scenario target/xtask/m9-check/
      - name: Upload the M9 check VHDXs
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx-m9-check
          path: target/xtask/m9-check
          if-no-files-found: error

  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets and components
        run: |
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo xtask clippy

  miri:
    # Two shards, so each stays well inside the time limit as tests grow:
    # the M5 thread, IPC and address-space modules, and everything else.
    name: Miri on core (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: threads, IPC and paging
            args: "ipc:: syscall:: tcb:: sched:: regs:: vspace::"
          - shard: the rest
            args: "--skip ipc:: --skip syscall:: --skip tcb:: --skip sched:: --skip regs:: --skip vspace::"
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test --package l4core -- ${{ matrix.args }}
