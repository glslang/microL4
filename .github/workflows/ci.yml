name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# ubuntu-24.04 matches the cloud sessions' image (QEMU 8.2), so scenario
# output, and from M8 golden images, agree between CI and sessions.
jobs:
  test:
    name: Test and build the VHDX
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, image tools and Rust targets
        run: tools/setup.sh
      - name: Host tests and QEMU scenarios
        run: cargo xtask test
      - name: Upload scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs
          path: target/xtask/scenarios/*/serial.log
          if-no-files-found: ignore
      - name: Build the disk image
        run: cargo xtask image
      - name: Upload the VHDX for the Hyper-V check
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx
          path: target/xtask/image/disk.vhdx
          if-no-files-found: error
      # The M5 Hyper-V check (tools/hyperv/README.md): M5's two done-when
      # tests, one image each. The root task runs both in ring 3.
      - name: Build the M5 threads image
        run: cargo xtask image --cmdline "test=threads"
      - name: Upload the M5 threads VHDX
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx-m5-threads
          path: target/xtask/image/disk.vhdx
          if-no-files-found: error
      - name: Build the M5 fault image
        run: cargo xtask image --cmdline "test=fault"
      - name: Upload the M5 fault VHDX
        uses: actions/upload-artifact@v4
        with:
          name: microl4-vhdx-m5-fault
          path: target/xtask/image/disk.vhdx
          if-no-files-found: error

  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets and components
        run: |
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo xtask clippy

  miri:
    # Two shards, so each stays well inside the time limit as tests grow:
    # the M5 thread, IPC and address-space modules, and everything else.
    name: Miri on core (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: threads, IPC and paging
            args: "ipc:: syscall:: tcb:: sched:: regs:: vspace::"
          - shard: the rest
            args: "--skip ipc:: --skip syscall:: --skip tcb:: --skip sched:: --skip regs:: --skip vspace::"
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test --package l4core -- ${{ matrix.args }}
